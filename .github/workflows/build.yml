name: Build Sultan Pharmacy App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Auto-generate Android & Web files
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --platforms android,web --org com.sultanpharmacy app
          cd ..
          cp -r temp_app/app/android .
          if [ ! -d "web" ]; then
            cp -r temp_app/app/web .
          fi
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Web for iPhone
        run: flutter build web --base-href "/sultan-pharmacy-/" --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharmacy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
