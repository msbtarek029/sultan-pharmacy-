name: Build Sultan Pharmacy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Auto-generate Android files
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --platforms android --org com.sultanpharmacy app
          cd ..
          cp -r temp_app/app/android .
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharmacy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
